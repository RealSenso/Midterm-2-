<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StoMA Midterm 2 Watchlist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}*{box-sizing:border-box}
/* Layout: single reading column, one block per day, videos as checkable rows with channel chip + duration */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --fg:#1a1f2b; --muted:#5e6678; --line:#dfe3ea; --accent:#2f5bd3;
  --J:#2f5bd3; --H:#a5262a; --M:#8a5a00; --K:#1d7a55;
  --display:"Fraunces",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151c; --panel:#1a1e27; --fg:#e6e9f0; --muted:#9aa3b5; --line:#2b313d; --accent:#7f9dff;
  --J:#7f9dff; --H:#ff8a8d; --M:#e7b452; --K:#5fd3a0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --panel:#1a1e27; --fg:#e6e9f0; --muted:#9aa3b5; --line:#2b313d; --accent:#7f9dff;
  --J:#7f9dff; --H:#ff8a8d; --M:#e7b452; --K:#5fd3a0; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
.wrap{max-width:780px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:600 clamp(26px,5vw,36px)/1.15 var(--display);margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px;max-width:65ch}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted);margin-bottom:10px}
.legend a{color:inherit}
.chip{font:500 11px/1 var(--mono);letter-spacing:.04em;padding:4px 6px;border-radius:4px;border:1px solid currentColor;flex:none}
.c0{color:var(--J)}.c1{color:var(--K)}.c2{color:var(--H)}.c3{color:var(--M)}.c4{color:var(--muted)}
.nav{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}.nav a{font:500 13px var(--body);color:var(--muted);text-decoration:none;padding:5px 12px;border:1px solid var(--line);border-radius:999px}.nav a[aria-current]{color:var(--bg);background:var(--fg);border-color:var(--fg)}.nav a:hover:not([aria-current]){color:var(--fg)}
.prog{display:flex;align-items:center;gap:10px;font:500 13px var(--mono);color:var(--muted);margin:14px 0 26px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 16px 4px}
.dh h2{font:600 20px/1.2 var(--display);margin:0}
.dh span{font:400 12px var(--mono);color:var(--muted)}
.topic{padding:8px 16px 2px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
ol{list-style:none;margin:0;padding:0 0 8px}
li{display:flex;align-items:flex-start;gap:10px;padding:7px 16px;border-top:1px solid transparent}
li:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
li input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
li .t{flex:1;min-width:0}
li a{color:var(--fg);text-decoration:none;font-weight:500}
li a:hover{text-decoration:underline;color:var(--accent)}
li a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
li .note{display:block;font-size:13px;color:var(--muted)}
li .d{font:400 12px var(--mono);color:var(--muted);flex:none;margin-top:3px;font-variant-numeric:tabular-nums}
li.opt a{font-weight:400}
li.opt .tag{font:500 10px var(--mono);color:var(--muted);border:1px dashed var(--line);border-radius:3px;padding:1px 4px;margin-left:6px;white-space:nowrap}
li.done a{color:var(--muted);text-decoration:line-through}
.gap{margin:4px 16px 12px;font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
button{font:500 13px var(--body);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav" aria-label="Subjects"><a href="./" aria-current="page">StoMA</a><a href="./laa/">LAA</a><a href="./dip/">DIP</a></nav>
  <h1>StoMA Midterm 2 Watchlist</h1>
  <p class="sub" id="sub"></p>
  <div class="legend" id="legend"></div>
  <div class="prog"><span id="pc">0 / 0 watched</span><div class="bar"><i id="pb"></i></div></div>
  <div class="tools"><button id="hideopt" type="button">Hide extras</button><button id="reset" type="button">Clear ticks</button></div>
  <div id="days"></div>
</div>
<script>

  ["K","P6TYfLId7j4","lec48 · Sums of jointly continuous RVs","24:09"],
  ["K","qvny65_gZQM","lec47 · Sums of discrete RVs","22:02","",1],

  ["K","30x5TyidptI","lec51 · Jacobian formula","23:24"],
  ["K","yhd4pSm3bEA","lec52 · Examples using the Jacobian formula","24:46"],

  ["J","zsRWu6W6aYg","Expected value of a function of several random variables","6:17"],

  ["J","oqhhrqfRpb8","Covariance","10:15"],
  ["J","RBioTO4jNOU","Covariance, results","15:12"],

  ["M","XtNXQJkgkhI","L22 · Bayesian statistical inference II","52:16","Watch the linear least-mean-squares part for linear LSE"],

  ["H","MF-XSJOsGqw","L30 · Chi-square, Student-t, multivariate normal","47:28","Last third is the MVN part",1],

];

const KEY="stoma-w";
const codes=Object.keys(CHS),CI=Object.fromEntries(codes.map((c,i)=>[c,i]));
document.getElementById("sub").innerHTML=SUB;
document.getElementById("legend").innerHTML=codes.filter(c=>CHS[c][2]).map(c=>`<span><span class="chip c${CI[c]}">${CHS[c][0]}</span> <a href="${CHS[c][2]}" target="_blank" rel="noopener">${CHS[c][1]}</a></span>`).join("")+(codes.some(c=>!CHS[c][2])?`<span><span class="chip c4">+</span> one-off videos from other channels</span>`:"");
const sec=s=>s.split(":").reduce((a,b)=>a*60+ +b,0);
const fmt=t=>{const h=Math.floor(t/3600),m=Math.round(t%3600/60);return (h?h+" h ":"")+m+" min"};
let st={},hide=false;
try{st=JSON.parse(localStorage.getItem(KEY)||"{}");hide=localStorage.getItem(KEY+"-hide")==="1"}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
function render(){
  const root=document.getElementById("days");root.innerHTML="";
  D.forEach(day=>{
    let core=0;
    const box=document.createElement("section");box.className="day";
    const body=day.topics.map(([tp,vs])=>{
      const rows=vs.map(([c,id,t,dur,note,opt])=>{
        if(!opt)core+=sec(dur);
        if(opt&&hide)return "";
        return `<li class="${opt?"opt":""} ${st[id]?"done":""}"><input type="checkbox" id="v${id}" data-id="${id}" ${st[id]?"checked":""} aria-label="Watched: ${t}"><span class="chip c${CHS[c][2]?CI[c]:4}">${CHS[c][0]}</span><span class="t"><a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">${t}</a>${opt?'<span class="tag">extra</span>':""}${note?`<span class="note">${note}</span>`:""}</span><span class="d">${dur}</span></li>`}).join("");
      return `<div class="topic">${tp}</div><ol>${rows}</ol>`}).join("");
    box.innerHTML=`<div class="dh"><h2>${day.d}</h2><span>${core?fmt(core)+" core":"rest from videos"}</span></div>${body}${day.gap?`<p class="gap">${day.gap}</p>`:""}`;
    root.appendChild(box);
  });
  const all=D.flatMap(d=>d.topics.flatMap(t=>t[1])),done=all.filter(v=>st[v[1]]).length;
  document.getElementById("pc").textContent=`${done} / ${all.length} watched`;
  document.getElementById("pb").style.width=(100*done/all.length)+"%";
  document.getElementById("hideopt").textContent=hide?"Show extras":"Hide extras";
}
document.getElementById("days").addEventListener("change",e=>{const id=e.target.dataset.id;if(!id)return;if(e.target.checked)st[id]=1;else delete st[id];save();render()});
document.getElementById("hideopt").onclick=()=>{hide=!hide;try{localStorage.setItem(KEY+"-hide",hide?"1":"0")}catch(e){};render()};
document.getElementById("reset").onclick=e=>{if(e.target.dataset.arm){st={};save();delete e.target.dataset.arm;e.target.textContent="Clear ticks";render()}else{e.target.dataset.arm=1;e.target.textContent="Click again to clear"}};
render();
</script>
</body>
</html>
